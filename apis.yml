aid: bloomberg-beta
name: Bloomberg Beta
description: >-
  Bloomberg Beta is an early-stage venture capital firm that invests in companies
  making business work better, with a particular focus on the future of work,
  machine intelligence, and technologies reshaping how companies operate. Founded
  in 2013 and capitalized entirely by Bloomberg L.P. (though it invests
  independently), the firm runs approximately $450M across five $75M funds - its
  2013, 2016, 2019, and 2022 vintages plus a first opportunity fund for follow-on
  investments in existing portfolio companies. Bloomberg Beta writes seed and
  early-stage checks (roughly $1M-$7M), leads or co-leads rounds, and is known for
  operating in public: its entire "operating manual," investment criteria, and full
  publicly announced portfolio live openly on GitHub, and it open-sources its Series
  Seed, SAFE, and note investment documents. The firm operates from San Francisco
  (140 New Montgomery St.) and New York (731 Lexington Ave.), backs founders across
  developer tools, infrastructure, security, AI, and enterprise software, and
  measures itself primarily on founder NPS.
